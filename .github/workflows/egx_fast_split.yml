name: EGX Fast Scrape (split)




# Adjust this schedule to match your existing egx_fast.yml.
on:

 
  workflow_dispatch:

jobs:
  indices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright beautifulsoup4
      - run: playwright install --with-deps chromium
      - run: python parts/scrape_indices_section.py
      - uses: actions/upload-artifact@v4
        with:
          name: egx-section-indices
          path: egx_indices.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dumps-indices
          path: parts/debug_dumps/
          if-no-files-found: ignore

  homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright beautifulsoup4
      - run: playwright install --with-deps chromium
      - run: python parts/scrape_homepage_section.py
      - uses: actions/upload-artifact@v4
        with:
          name: egx-section-homepage
          path: egx_homepage.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dumps-homepage
          path: parts/debug_dumps/
          if-no-files-found: ignore

  gainers_losers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright beautifulsoup4
      - run: playwright install --with-deps chromium
      - run: python parts/scrape_gainers_losers_section.py
      - uses: actions/upload-artifact@v4
        with:
          name: egx-section-gl
          path: egx_gl.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dumps-gl
          path: parts/debug_dumps/
          if-no-files-found: ignore

  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright beautifulsoup4
      - run: playwright install --with-deps chromium
      - run: python parts/scrape_prices_section.py
      - uses: actions/upload-artifact@v4
        with:
          name: egx-section-prices
          path: egx_prices_section.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dumps-prices
          path: parts/debug_dumps/
          if-no-files-found: ignore

  investor_activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright beautifulsoup4
      - run: playwright install --with-deps chromium
      - run: python parts/scrape_investor_section.py
      - uses: actions/upload-artifact@v4
        with:
          name: egx-section-investor
          path: egx_investor.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dumps-investor
          path: parts/debug_dumps/
          if-no-files-found: ignore

  merge:
    permissions:
      contents: write

    # if: always() is the important part here - a partial run (some
    # sections blocked, some not) should still publish whatever came
    # through, rather than the whole workflow going red and nothing
    # getting published at all.
    needs: [indices, homepage, gainers_losers, prices, investor_activity]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: egx-section-*
          merge-multiple: true
      - run: python parts/merge_egx_sections.py
      # Replace this with whatever your existing egx_fast.yml does to
      # publish egx.json (commit back to the repo, push to a Pages
      # branch, upload to a bucket, etc) - that step should move here.
      - name: Commit egx.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add egx.json
          git diff --staged --quiet || git commit -m "Update egx.json [skip ci]"
          git push
