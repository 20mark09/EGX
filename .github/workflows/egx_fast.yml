name: EGX Scraper - Fast (Indices + Prices)

on:
  repository_dispatch:
      types: [run-fast]
  #schedule:
    # Every 15 minutes, 06:00-15:00 UTC, Sunday-Thursday (EGX's trading
    # week). GitHub doesn't guarantee scheduled workflows fire at the
    # exact minute - they can lag under high platform load, more so the
    # tighter the schedule - so "every ~15 minutes" is realistic, not a
    # hard guarantee.
    #- cron: "*/20 6-12 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egx-fast
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4 playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run Fast Scraper
        run: python scrape_egx_fast.py

      - name: Commit JSON
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase --autostash
          git add egx.json
          git diff --cached --quiet || git commit -m "Update EGX prices/indices"
          git push
