name: EGX Scraper - Bulletin (fastest)

on:
  schedule:
    # Every 5 minutes, 06:00-15:00 UTC, Sunday-Thursday. 5 minutes is the
    # shortest interval GitHub Actions' scheduled workflows practically
    # support - anything tighter than that isn't reliably honored and
    # can get silently coalesced/dropped by GitHub under load.
    - cron: "*/10 6-12 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egx-bulletin
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install beautifulsoup4 playwright requests google-auth
          playwright install chromium
          playwright install-deps chromium

      - name: Run Bulletin Scraper
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: python scrape_egx_bulletin.py

      - name: Commit JSON
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase --autostash
          git add egx_bulletin.json bulletin_state.json
          git diff --cached --quiet || git commit -m "Update EGX bulletin"
          git push
